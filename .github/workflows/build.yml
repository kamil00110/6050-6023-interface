name: Build

on: [push, pull_request]

jobs:
  build-client:
    name: client ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "windows_x64_msvc"
          os: windows-latest
          generator: "Visual Studio 17 2022"
          arch: "-A x64"
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: true
          defines: ""

        - name: "ubuntu_24.04_arm64"
          os: ubuntu-24.04-arm
          generator: "Unix Makefiles"
          arch: ""
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: true
          defines: ""

        - name: "macos-15-intel"
          os: "macos-15-intel"
          generator: "Unix Makefiles"
          arch: ""
          osx_arch: x86_64
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

        - name: "macos-15-arm64"
          os: "macos-15"
          generator: "Unix Makefiles"
          arch: ""
          osx_arch: arm64
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    # All:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    # Windows only:
    - name: Install Qt 5
      if: startswith(matrix.config.os, 'windows')
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: 5.15

    # macOS only:
    - name: Install Qt 6.5
      if: startswith(matrix.config.os, 'macos')
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        modules: qtwebsockets
        version: 6.5.*

    - name: Set CMAKE_OSX_ARCHITECTURES
      if: startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('CMAKE_OSX_ARCHITECTURES', '${{matrix.config.osx_arch}}');

    # Ubuntu only:
    - name: apt update
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt update

    # Ubuntu only:
    - name: Install packages
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt install qt6-base-dev qt6-svg-dev qt6-websockets-dev

    # All:
    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/client/build

    # All:
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/client/build
      run: cmake $GITHUB_WORKSPACE/client -G "${{matrix.config.generator}}" ${{matrix.config.arch}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.defines}}

    # All:
    - name: Build
      working-directory: ${{github.workspace}}/client/build
      shell: bash
      run: cmake --build . --config ${{matrix.config.build_type}} --target ${{matrix.config.target}} --parallel ${{matrix.config.jobs}}

    # Windows only:
    - name: Run windeployqt
      if: startswith(matrix.config.os, 'windows')
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        windeployqt --release --no-translations -no-system-d3d-compiler --no-opengl-sw ${{github.workspace}}/client/build/${{matrix.config.build_type}}/traintastic-client.exe

    # Linux only:
    - name: Build debian package
      if: matrix.config.build_deb
      working-directory: ${{github.workspace}}/client/build
      run: cpack

    # Windows only:
    - name: Upload artifact
      if: startswith(matrix.config.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-client-windows
        path: ${{github.workspace}}/client/build/${{matrix.config.build_type}}

    # Linux only:
    - name: Upload debian package artifact
      if: matrix.config.build_deb
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-client-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/client/build/*.deb

  build-server:
    name: server ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "windows_x64_clang"
          os: windows-latest
          generator: "Visual Studio 17 2022"
          arch: "-A x64"
          toolset: "-T ClangCL"
          target: ALL_BUILD
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: true
          defines: "-DINSTALL_SYSTEMD_SERVICE=ON"
          ccov: false

        - name: "ubuntu_24.04 (debug+ccov)"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: traintastic-server-test
          jobs: 4
          build_type: Debug
          build_deb: false
          defines: "-DCODE_COVERAGE=ON"
          ccov: true

        - name: "ubuntu_24.04_arm64"
          os: ubuntu-24.04-arm
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: true
          defines: "-DINSTALL_SYSTEMD_SERVICE=ON"
          ccov: false

        - name: "macos-15-intel"
          os: "macos-15-intel"
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

        - name: "macos-15-arm64"
          os: "macos-15"
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    # All:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set VCPKG_ROOT
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('VCPKG_ROOT', process.env.VCPKG_INSTALLATION_ROOT || '');

    - name: Set CMAKE_OSX_ARCHITECTURES
      if: startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('CMAKE_OSX_ARCHITECTURES', 'x86_64');

    # Ubuntu only:
    - name: apt update
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt update

    # Ubuntu only:
    - name: Install packages
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt install libboost-program-options-dev libboost-url-dev liblua5.4-dev lcov libarchive-dev clang-tidy libsystemd-dev

    # MacOS only:
    - name: Install brew packages
      if: startswith(matrix.config.os, 'macos')
      run: brew install libarchive lua@5.4

    # All:
    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/server/build

    # All:
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/server/build
      # Note the current convention is to use the -S and -B options here to specify source
      # and build directories, but this is only available with CMake 3.13 and higher.
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake $GITHUB_WORKSPACE/server -G "${{matrix.config.generator}}" ${{matrix.config.arch}} ${{matrix.config.toolset}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.defines}}

    # All:
    - name: Build
      working-directory: ${{github.workspace}}/server/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config ${{matrix.config.build_type}} --target ${{matrix.config.target}} --parallel ${{matrix.config.jobs}}

    # mingw only
    #- name: Run tests (mingw)
    #  if: matrix.config.name == 'windows_x64_mingw'
    #  working-directory: ${{github.workspace}}/server/build
    #  run: |
    #    $env:PATH += ';C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
    #    ctest --output-on-failure

    # All:
    - name: Run tests
      if: matrix.config.name != 'windows_x64_mingw'
      working-directory: ${{github.workspace}}/server/build
      run: ctest --output-on-failure

    # Linux only:
    - name: Build debian package
      if: matrix.config.build_deb
      working-directory: ${{github.workspace}}/server/build
      run: cpack

    # Windows only:
    - name: Upload artifact
      if: matrix.config.name == 'windows_x64_clang'
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-windows
        path: ${{github.workspace}}/server/build/Release/traintastic-server.exe

    # Linux only:
    - name: Upload debian package artifact
      if: matrix.config.build_deb
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/server/build/*.deb

    # Code coverage:
    - name: Code coverage
      if: matrix.config.ccov
      working-directory: ${{github.workspace}}/server/build
      run: make ccov

    - name: "Code coverage: upload to coveralls.io"
      if: matrix.config.ccov
      continue-on-error: true
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        path-to-lcov: ${{github.workspace}}/server/build/ccov/traintastic-server-test.info

    - name: "Code coverage: upload artifact"
      if: matrix.config.ccov
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-test-code-coverage
        path: ${{github.workspace}}/server/build/ccov/*

  build-data:
    name: shared data ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    needs: [build-lang, build-manual]
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          defines: ""

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations

    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/shared/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/shared/build
      run: cmake $GITHUB_WORKSPACE/shared ${{matrix.config.defines}}

    - name: Build debian package
      working-directory: ${{github.workspace}}/shared/build
      run: cpack

    - name: Upload debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-data-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/shared/build/*.deb

  build-lang:
    name: language files
    runs-on: ubuntu-latest

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build language files
      working-directory: ${{github.workspace}}/shared/translations
      run: python3 json2lang.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations/*.lang

  build-manual:
    name: manual
    runs-on: ubuntu-latest

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install python requirements
      working-directory: ${{github.workspace}}/manual
      run: sudo pip3 install -r requirements.txt

    - name: Build manual
      working-directory: ${{github.workspace}}/manual
      run: ./build.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output/*

  package-qtinstaller:
    name: package qtinstaller
    runs-on: windows-2022
    needs: [build-client, build-server, build-lang, build-manual]
    steps:
    - uses: FranzDiebold/github-env-vars-action@v2
    
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Download artifacts 1/2
      uses: actions/download-artifact@v4
      with:
        name: traintastic-client-windows
        path: ${{github.workspace}}/client/build/Release
    
    - name: Download artifacts 2/2
      uses: actions/download-artifact@v4
      with:
        name: traintastic-server-windows
        path: ${{github.workspace}}/server/build
    
    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations
    
    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output
    
    - name: Install Qt Installer Framework
      shell: pwsh
      run: |
        $qtifw_version = "4.8.1"
        $qtifw_url = "https://download.qt.io/official_releases/qt-installer-framework/$qtifw_version/QtInstallerFramework-windows-x64-$qtifw_version.exe"
        $qtifw_installer = "$env:TEMP\QtIFW-installer.exe"
        $install_path = "C:\Qt\Tools\QtInstallerFramework\$qtifw_version"
        
        Write-Host "Downloading Qt Installer Framework $qtifw_version..."
        Invoke-WebRequest -Uri $qtifw_url -OutFile $qtifw_installer
        
        Write-Host "Installing Qt Installer Framework..."
        Start-Process -FilePath $qtifw_installer -ArgumentList @(
          '--accept-licenses',
          '--confirm-command',
          '--root', $install_path,
          'install'
        ) -Wait -NoNewWindow
        
        Write-Host "Qt Installer Framework installed successfully"
    
    - name: Build installer
      shell: cmd
      run: |
        cd %GITHUB_WORKSPACE%\package\qtinstaller
        call build-installer.bat
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-qtinstaller
        path: ${{github.workspace}}/package/qtinstaller/output/*.exe
        
  package-qtinstaller-ubuntu-universal:
    name: package qtinstaller ubuntu (universal x64+arm64)
    runs-on: ubuntu-24.04
    needs: [build-client, build-server, build-data]
    
    steps:
    - uses: FranzDiebold/github-env-vars-action@v2
    
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install Qt Installer Framework
      run: |
        sudo apt update
        sudo apt install -y wget p7zip-full libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0 libxcb-keysyms1 libxcb-icccm4 libxcb-image0 libxcb-render-util0 libxcb-util1 libxrender1 libxi6 libsm6 libice6 libegl1 libgl1
        
        QTIFW_VERSION="4.8.1"
        QTIFW_URL="https://download.qt.io/official_releases/qt-installer-framework/${QTIFW_VERSION}/QtInstallerFramework-linux-x64-${QTIFW_VERSION}.run"
        
        echo "Downloading Qt Installer Framework ${QTIFW_VERSION}..."
        wget -q ${QTIFW_URL} -O /tmp/qtifw-installer.run
        
        echo "Installing Qt Installer Framework..."
        chmod +x /tmp/qtifw-installer.run
        /tmp/qtifw-installer.run --accept-licenses --confirm-command --root ~/QtIFW install
        
        echo "Qt Installer Framework installed successfully"
        echo "$HOME/QtIFW/bin" >> $GITHUB_PATH
    
    - name: Download x64 artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: traintastic-*-deb-ubuntu_24.04
        path: ${{github.workspace}}/artifacts/x64
        merge-multiple: false
    
    - name: Download arm64 artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: traintastic-*-deb-ubuntu_24.04_arm64
        path: ${{github.workspace}}/artifacts/arm64
        merge-multiple: false
    
    - name: Extract deb packages
      run: |
        # Extract x64 packages
        mkdir -p ${{github.workspace}}/extracted/x64/client
        mkdir -p ${{github.workspace}}/extracted/x64/server
        mkdir -p ${{github.workspace}}/extracted/shared
        
        dpkg-deb -x ${{github.workspace}}/artifacts/x64/traintastic-client-deb-ubuntu_24.04/*.deb ${{github.workspace}}/extracted/x64/client/
        dpkg-deb -x ${{github.workspace}}/artifacts/x64/traintastic-server-deb-ubuntu_24.04/*.deb ${{github.workspace}}/extracted/x64/server/
        dpkg-deb -x ${{github.workspace}}/artifacts/x64/traintastic-data-deb-ubuntu_24.04/*.deb ${{github.workspace}}/extracted/shared/
        
        # Extract arm64 packages
        mkdir -p ${{github.workspace}}/extracted/arm64/client
        mkdir -p ${{github.workspace}}/extracted/arm64/server
        
        dpkg-deb -x ${{github.workspace}}/artifacts/arm64/traintastic-client-deb-ubuntu_24.04_arm64/*.deb ${{github.workspace}}/extracted/arm64/client/
        dpkg-deb -x ${{github.workspace}}/artifacts/arm64/traintastic-server-deb-ubuntu_24.04_arm64/*.deb ${{github.workspace}}/extracted/arm64/server/
    
    - name: Create universal package structure
      run: |
        cd ${{github.workspace}}/package/qtinstaller-linux
        
        # Create architecture-specific component directories
        mkdir -p packages/org.traintastic.client.x64/{meta,data}
        mkdir -p packages/org.traintastic.client.arm64/{meta,data}
        mkdir -p packages/org.traintastic.server.x64/{meta,data}
        mkdir -p packages/org.traintastic.server.arm64/{meta,data}
        
        # Copy extracted files
        cp -r ${{github.workspace}}/extracted/x64/client/* packages/org.traintastic.client.x64/data/
        cp -r ${{github.workspace}}/extracted/arm64/client/* packages/org.traintastic.client.arm64/data/
        cp -r ${{github.workspace}}/extracted/x64/server/* packages/org.traintastic.server.x64/data/
        cp -r ${{github.workspace}}/extracted/arm64/server/* packages/org.traintastic.server.arm64/data/
        
        # Copy shared data (architecture-independent)
        mkdir -p packages/org.traintastic.shared/data
        if [ -d "${{github.workspace}}/extracted/shared/usr/share/traintastic" ]; then
          cp -r ${{github.workspace}}/extracted/shared/usr/share/traintastic/* packages/org.traintastic.shared/data/
        fi
    
    - name: Create architecture-specific package files
      run: |
        cd ${{github.workspace}}/package/qtinstaller-linux
        
        # Create package.xml for x64 client
        cat > packages/org.traintastic.client.x64/meta/package.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <Package>
            <DisplayName>Traintastic Client (x64)</DisplayName>
            <Description>Client for x86_64/AMD64 systems</Description>
            <Version>1.0.0</Version>
            <ReleaseDate>2025-01-01</ReleaseDate>
            <Name>org.traintastic.client.x64</Name>
            <Default>script</Default>
            <Script>installscript.js</Script>
            <Licenses>
                <License name="TraintasticLicense" file="license.txt" />
            </Licenses>
        </Package>
        EOF
        
        # Create package.xml for arm64 client
        cat > packages/org.traintastic.client.arm64/meta/package.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <Package>
            <DisplayName>Traintastic Client (ARM64)</DisplayName>
            <Description>Client for ARM64/aarch64 systems</Description>
            <Version>1.0.0</Version>
            <ReleaseDate>2025-01-01</ReleaseDate>
            <Name>org.traintastic.client.arm64</Name>
            <Default>script</Default>
            <Script>installscript.js</Script>
            <Licenses>
                <License name="TraintasticLicense" file="license.txt" />
            </Licenses>
        </Package>
        EOF
        
        # Create package.xml for x64 server
        cat > packages/org.traintastic.server.x64/meta/package.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <Package>
            <DisplayName>Traintastic Server (x64)</DisplayName>
            <Description>Server for x86_64/AMD64 systems</Description>
            <Version>1.0.0</Version>
            <ReleaseDate>2025-01-01</ReleaseDate>
            <Name>org.traintastic.server.x64</Name>
            <Default>script</Default>
            <Script>installscript.js</Script>
            <Licenses>
                <License name="TraintasticLicense" file="license.txt" />
            </Licenses>
        </Package>
        EOF
        
        # Create package.xml for arm64 server
        cat > packages/org.traintastic.server.arm64/meta/package.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <Package>
            <DisplayName>Traintastic Server (ARM64)</DisplayName>
            <Description>Server for ARM64/aarch64 systems</Description>
            <Version>1.0.0</Version>
            <ReleaseDate>2025-01-01</ReleaseDate>
            <Name>org.traintastic.server.arm64</Name>
            <Default>script</Default>
            <Script>installscript.js</Script>
            <Licenses>
                <License name="TraintasticLicense" file="license.txt" />
            </Licenses>
        </Package>
        EOF
        
        # Copy installscripts (same for all architectures)
        cp packages/org.traintastic.client/meta/installscript.js packages/org.traintastic.client.x64/meta/
        cp packages/org.traintastic.client/meta/installscript.js packages/org.traintastic.client.arm64/meta/
        cp packages/org.traintastic.server/meta/installscript.js packages/org.traintastic.server.x64/meta/
        cp packages/org.traintastic.server/meta/installscript.js packages/org.traintastic.server.arm64/meta/
        
        # Copy licenses
        cp ${{github.workspace}}/LICENSE packages/org.traintastic.client.x64/meta/license.txt
        cp ${{github.workspace}}/LICENSE packages/org.traintastic.client.arm64/meta/license.txt
        cp ${{github.workspace}}/LICENSE packages/org.traintastic.server.x64/meta/license.txt
        cp ${{github.workspace}}/LICENSE packages/org.traintastic.server.arm64/meta/license.txt
    
    - name: Create architecture detection controller
      run: |
        cd ${{github.workspace}}/package/qtinstaller-linux/config
        
        # Backup original controller
        mv controller.js controller-original.js
        
        # Create new controller with arch detection
        cat > controller.js << 'EOF'
        function Controller() {
            installer.setValue("verbose", "true");
            
            // Detect architecture at startup
            var arch = installer.execute("uname", ["-m"])[0];
            if (arch) {
                arch = arch.trim();
            }
            
            console.log("Detected architecture: " + arch);
            
            var detectedArch = "unknown";
            if (arch === "x86_64" || arch === "amd64") {
                detectedArch = "x64";
            } else if (arch === "aarch64" || arch === "arm64") {
                detectedArch = "arm64";
            }
            
            installer.setValue("DetectedArch", detectedArch);
            console.log("Will install for: " + detectedArch);
            
            if (detectedArch === "unknown") {
                QMessageBox.critical(
                    "unsupportedArchitecture",
                    "Unsupported Architecture",
                    "Your system architecture (" + arch + ") is not supported.\n\n" +
                    "Traintastic supports:\n" +
                    "• x86_64 (Intel/AMD 64-bit)\n" +
                    "• ARM64 (aarch64)\n\n" +
                    "Installation cannot continue.",
                    QMessageBox.Ok
                );
            }
        }
        
        Controller.prototype.IntroductionPageCallback = function() {
            var widget = gui.currentPageWidget();
            if (widget != null) {
                if (installer.isInstaller()) {
                    var detectedArch = installer.value("DetectedArch");
                    var archName = detectedArch === "x64" ? "x86_64" : (detectedArch === "arm64" ? "ARM64" : "Unknown");
                    
                    widget.title = "Welcome to Traintastic Installer";
                    if (widget.MessageLabel) {
                        widget.MessageLabel.setText(
                            "This will install Traintastic on your computer.\n\n" +
                            "Detected architecture: " + archName
                        );
                    }
                }
            }
        }
        
        Controller.prototype.ComponentSelectionPageCallback = function() {
            var widget = gui.currentPageWidget();
            if (widget != null) {
                var detectedArch = installer.value("DetectedArch");
                
                console.log("ComponentSelection: Auto-selecting components for " + detectedArch);
                
                // Get all components
                var clientX64 = installer.componentByName("org.traintastic.client.x64");
                var clientArm64 = installer.componentByName("org.traintastic.client.arm64");
                var serverX64 = installer.componentByName("org.traintastic.server.x64");
                var serverArm64 = installer.componentByName("org.traintastic.server.arm64");
                
                if (detectedArch === "x64") {
                    // Select x64, deselect arm64
                    if (clientX64) {
                        clientX64.setValue("Default", "true");
                        installer.setDefaultComponentForUser("org.traintastic.client.x64", true);
                    }
                    if (serverX64) {
                        serverX64.setValue("Default", "true");
                        installer.setDefaultComponentForUser("org.traintastic.server.x64", true);
                    }
                    if (clientArm64) {
                        clientArm64.setValue("Default", "false");
                        installer.setDefaultComponentForUser("org.traintastic.client.arm64", false);
                    }
                    if (serverArm64) {
                        serverArm64.setValue("Default", "false");
                        installer.setDefaultComponentForUser("org.traintastic.server.arm64", false);
                    }
                } else if (detectedArch === "arm64") {
                    // Select arm64, deselect x64
                    if (clientArm64) {
                        clientArm64.setValue("Default", "true");
                        installer.setDefaultComponentForUser("org.traintastic.client.arm64", true);
                    }
                    if (serverArm64) {
                        serverArm64.setValue("Default", "true");
                        installer.setDefaultComponentForUser("org.traintastic.server.arm64", true);
                    }
                    if (clientX64) {
                        clientX64.setValue("Default", "false");
                        installer.setDefaultComponentForUser("org.traintastic.client.x64", false);
                    }
                    if (serverX64) {
                        serverX64.setValue("Default", "false");
                        installer.setDefaultComponentForUser("org.traintastic.server.x64", false);
                    }
                }
                
                // Refresh the component tree
                widget.selectAll();
            }
        }
        
        Controller.prototype.TargetDirectoryPageCallback = function() {
            var widget = gui.currentPageWidget();
            if (widget != null) {
                widget.TargetDirectoryLineEdit.setText(installer.value("TargetDir"));
            }
        }
        
        Controller.prototype.FinishedPageCallback = function() {
            var widget = gui.currentPageWidget();
            if (widget != null) {
                if (installer.isInstaller() || installer.isUpdater()) {
                    if (widget.RunItCheckBox) {
                        widget.RunItCheckBox.visible = true;
                        widget.RunItCheckBox.checked = false;
                    }
                }
            }
        }
        EOF
    
    - name: Build universal installer
      run: |
        cd ${{github.workspace}}/package/qtinstaller-linux
        chmod +x build-installer.sh
        
        # Modify build script to name it "universal"
        sed -i 's/traintastic-setup-v${VERSION}-linux-${ARCH_NAME}.run/traintastic-setup-v${VERSION}-linux-universal.run/' build-installer.sh
        
        ./build-installer.sh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-qtinstaller-ubuntu-universal
        path: ${{github.workspace}}/package/qtinstaller-linux/output/*.run
        
  update-readme-contributors:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    name: Update contributers in README.md
    steps:
        - name: Update contribute list
          uses: akhilmhdh/contributors-readme-action@v2.3.9
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
