name: Build

# Your workflow_dispatch trigger + release/tag/changelog options are kept as-is.
# Dependency setup updated to match current upstream (Qt 6.5 + qtwebsockets, libarchive-dev,
# windows-2022, VC redist download) so builds find their dependencies again.
# Upstream's package-appimages and deploy jobs are intentionally NOT included
# (they need a self-hosted Raspberry Pi runner, the AppImage build scripts, and SSH deploy secrets).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Ready to release?'
        required: true
        default: 'no'
        type: choice
        options: [ "yes", "no" ]

      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string
      changelog:
        description: 'Changelog for this release'
        required: false
        default: ''
        type: string

jobs:
  build-client:
    name: client ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "windows_x64_msvc"
          os: windows-2022
          generator: "Visual Studio 17 2022"
          arch: "-A x64"
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: true
          defines: ""

        - name: "ubuntu_24.04_arm64"
          os: ubuntu-24.04-arm
          generator: "Unix Makefiles"
          arch: ""
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: true
          defines: ""

        # macOS and self-hosted Raspberry Pi client targets are intentionally
        # left disabled (same as your version) — add matrix entries here only if
        # you have those runners available.

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    # All:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    # Windows/macOS: install Qt 6.5 with the qtwebsockets module.
    # (Your old file installed Qt 5.15 on Windows, which is why the Qt dependency
    #  was no longer found — the project builds against Qt 6.)
    - name: Install Qt 6.5
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        modules: qtwebsockets
        version: 6.5.*

    - name: Set VCPKG_ROOT
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('VCPKG_ROOT', process.env.VCPKG_INSTALLATION_ROOT || '');

    - name: Set CMAKE_OSX_ARCHITECTURES
      if: startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('CMAKE_OSX_ARCHITECTURES', '${{matrix.config.osx_arch}}');

    # Ubuntu only:
    - name: apt update
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt update

    # Ubuntu only (added libarchive-dev to match upstream):
    - name: Install packages
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt install qt6-base-dev qt6-svg-dev qt6-websockets-dev libarchive-dev libopencv-dev

    # Cache vcpkg's compiled packages (LibArchive) for the Windows/macOS client.
    - name: Create vcpkg binary cache directory
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      shell: bash
      run: mkdir -p "${{ github.workspace }}/vcpkg-bincache"

    - name: Cache vcpkg binary packages
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-bincache
        key: vcpkg-${{ matrix.config.name }}-${{ hashFiles('client/vcpkg.json', 'client/vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ matrix.config.name }}-

    # All:
    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/client/build

    # All:
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/client/build
      run: cmake $GITHUB_WORKSPACE/client -G "${{matrix.config.generator}}" ${{matrix.config.arch}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.defines}}

    # All:
    - name: Build
      working-directory: ${{github.workspace}}/client/build
      shell: bash
      run: cmake --build . --config ${{matrix.config.build_type}} --target ${{matrix.config.target}} --parallel ${{matrix.config.jobs}}

    # Windows only:
    - name: Run windeployqt
      if: startswith(matrix.config.os, 'windows')
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        windeployqt --release --no-translations -no-system-d3d-compiler --no-opengl-sw ${{github.workspace}}/client/build/${{matrix.config.build_type}}/traintastic-client.exe

    # Linux only:
    - name: Build debian package
      if: matrix.config.build_deb
      working-directory: ${{github.workspace}}/client/build
      run: cpack

    # Windows only:
    - name: Upload artifact
      if: startswith(matrix.config.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-client-windows
        path: ${{github.workspace}}/client/build/${{matrix.config.build_type}}

    # Linux only:
    - name: Upload debian package artifact
      if: matrix.config.build_deb
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-client-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/client/build/*.deb

  build-server:
    name: server ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "windows_x64_clang"
          os: windows-2022
          generator: "Visual Studio 17 2022"
          arch: "-A x64"
          toolset: "-T ClangCL"
          target: ALL_BUILD
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: true
          defines: "-DINSTALL_SYSTEMD_SERVICE=ON"
          ccov: false

        - name: "ubuntu_24.04 (debug+ccov)"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: traintastic-server-test
          jobs: 4
          build_type: Debug
          build_deb: false
          defines: "-DCODE_COVERAGE=ON"
          ccov: true

        - name: "ubuntu_24.04_arm64"
          os: ubuntu-24.04-arm
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: true
          defines: "-DINSTALL_SYSTEMD_SERVICE=ON"
          ccov: false

        # macOS and self-hosted Raspberry Pi server targets intentionally disabled.

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    # All:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    # Cache vcpkg's compiled packages (OpenCV, Boost, Lua, ...) so they are built
    # once and restored on later runs. Only Windows/macOS use vcpkg (Linux uses apt).
    # Key tracks the manifest + the pinned vcpkg baseline; restore-keys gives a
    # partial hit when only a single dependency changed.
    - name: Create vcpkg binary cache directory
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      shell: bash
      run: mkdir -p "${{ github.workspace }}/vcpkg-bincache"

    - name: Cache vcpkg binary packages
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-bincache
        key: vcpkg-${{ matrix.config.name }}-${{ hashFiles('server/vcpkg.json', 'server/vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ matrix.config.name }}-

    - name: Set VCPKG_ROOT
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('VCPKG_ROOT', process.env.VCPKG_INSTALLATION_ROOT || '');

    - name: Set CMAKE_OSX_ARCHITECTURES
      if: startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('CMAKE_OSX_ARCHITECTURES', 'x86_64');

    # Ubuntu only:
    - name: apt update
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt update

    # Ubuntu only (keeps your libopencv-dev; libarchive-dev already present):
    - name: Install packages
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt install libboost-program-options-dev libopencv-dev libboost-url-dev liblua5.4-dev lcov libarchive-dev clang-tidy libsystemd-dev

    # MacOS only:
    - name: Install brew packages
      if: startswith(matrix.config.os, 'macos')
      run: brew install libarchive lua@5.4

    # All:
    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/server/build

    # All:
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/server/build
      run: cmake $GITHUB_WORKSPACE/server -G "${{matrix.config.generator}}" ${{matrix.config.arch}} ${{matrix.config.toolset}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.defines}}

    # All:
    - name: Build
      working-directory: ${{github.workspace}}/server/build
      shell: bash
      run: cmake --build . --config ${{matrix.config.build_type}} --target ${{matrix.config.target}} --parallel ${{matrix.config.jobs}}

    # All:
    - name: Run tests
      if: matrix.config.name != 'windows_x64_mingw'
      working-directory: ${{github.workspace}}/server/build
      run: ctest --output-on-failure

    # Linux only:
    - name: Build debian package
      if: matrix.config.build_deb
      working-directory: ${{github.workspace}}/server/build
      run: cpack

    # Windows only:
    - name: Upload artifact
      if: matrix.config.name == 'windows_x64_clang'
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-windows
        path: ${{github.workspace}}/server/build/Release/traintastic-server.exe

    # Linux only:
    - name: Upload debian package artifact
      if: matrix.config.build_deb
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/server/build/*.deb

    # Code coverage:
    - name: Code coverage
      if: matrix.config.ccov
      working-directory: ${{github.workspace}}/server/build
      run: make ccov

    - name: "Code coverage: upload to coveralls.io"
      if: matrix.config.ccov
      continue-on-error: true
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        path-to-lcov: ${{github.workspace}}/server/build/ccov/traintastic-server-test.info

    - name: "Code coverage: upload artifact"
      if: matrix.config.ccov
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-test-code-coverage
        path: ${{github.workspace}}/server/build/ccov/*

  build-data:
    name: shared data ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    needs: [build-lang, build-manual]
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          defines: ""

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations

    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/shared/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/shared/build
      run: cmake $GITHUB_WORKSPACE/shared ${{matrix.config.defines}}

    - name: Build debian package
      working-directory: ${{github.workspace}}/shared/build
      run: cpack

    - name: Upload debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-data-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/shared/build/*.deb

  build-lang:
    name: language files
    runs-on: ubuntu-latest

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build language files
      working-directory: ${{github.workspace}}/shared/translations
      run: python3 json2lang.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations/*.lang

  build-manual:
    name: manual
    runs-on: ubuntu-latest

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install python requirements
      working-directory: ${{github.workspace}}/manual
      run: sudo pip3 install -r requirements.txt

    - name: Build manual
      working-directory: ${{github.workspace}}/manual
      run: ./build.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output/*

  package-innosetup:
    name: package innosetup
    runs-on: windows-2022
    needs: [build-client, build-server, build-lang, build-manual]

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Download artifacts 1/2
      uses: actions/download-artifact@v4
      with:
        name: traintastic-client-windows
        path: ${{github.workspace}}/client/build/Release

    - name: Download artifacts 2/2
      uses: actions/download-artifact@v4
      with:
        name: traintastic-server-windows
        path: ${{github.workspace}}/server/build

    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations

    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output

    # Added from upstream: the installer bundles the VC++ redistributable.
    - name: Download latest VC14 redist
      shell: powershell
      working-directory: ${{github.workspace}}/package/innosetup
      run: |
        Invoke-Webrequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"

    - name: Build installer
      shell: cmd
      run: |
        "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" %GITHUB_WORKSPACE%/package/innosetup/traintastic.iss

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-innosetup
        path: ${{ github.workspace }}/package/innosetup/output

  update-readme-contributors:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    name: Update contributers in README.md
    steps:
        - name: Update contribute list
          uses: akhilmhdh/contributors-readme-action@v2.3.11
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-innosetup]
    if: ${{ github.event.inputs.release == 'yes' }}

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: package-innosetup
          path: release/

      - name: Download client .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: traintastic-client-deb-*
          merge-multiple: true
          path: release/

      - name: Download server .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: traintastic-server-deb-*
          merge-multiple: true
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "Installer Release ${{ github.event.inputs.tag_name }}"
          body: ${{ github.event.inputs.changelog }}
          files: release/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
