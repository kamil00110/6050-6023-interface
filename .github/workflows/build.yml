name: Build

on: [push, pull_request]

jobs:
  build-client:
    name: client ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "windows_x64_msvc"
          os: windows-latest
          generator: "Visual Studio 17 2022"
          arch: "-A x64"
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: true
          defines: ""

        - name: "ubuntu_24.04_arm64"
          os: ubuntu-24.04-arm
          generator: "Unix Makefiles"
          arch: ""
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: true
          defines: ""

        - name: "macos-15-intel"
          os: "macos-15-intel"
          generator: "Unix Makefiles"
          arch: ""
          osx_arch: x86_64
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

        - name: "macos-15-arm64"
          os: "macos-15"
          generator: "Unix Makefiles"
          arch: ""
          osx_arch: arm64
          target: traintastic-client
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    # All:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    # Windows only:
    - name: Install Qt 5
      if: startswith(matrix.config.os, 'windows')
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: 5.15

    # macOS only:
    - name: Install Qt 6.5
      if: startswith(matrix.config.os, 'macos')
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        modules: qtwebsockets
        version: 6.5.*

    - name: Set CMAKE_OSX_ARCHITECTURES
      if: startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('CMAKE_OSX_ARCHITECTURES', '${{matrix.config.osx_arch}}');

    # Ubuntu only:
    - name: apt update
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt update

    # Ubuntu only:
    - name: Install packages
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt install qt6-base-dev qt6-svg-dev qt6-websockets-dev

    # All:
    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/client/build

    # All:
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/client/build
      run: cmake $GITHUB_WORKSPACE/client -G "${{matrix.config.generator}}" ${{matrix.config.arch}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.defines}}

    # All:
    - name: Build
      working-directory: ${{github.workspace}}/client/build
      shell: bash
      run: cmake --build . --config ${{matrix.config.build_type}} --target ${{matrix.config.target}} --parallel ${{matrix.config.jobs}}

    # Windows only:
    - name: Run windeployqt
      if: startswith(matrix.config.os, 'windows')
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        windeployqt --release --no-translations -no-system-d3d-compiler --no-opengl-sw ${{github.workspace}}/client/build/${{matrix.config.build_type}}/traintastic-client.exe

    # Linux only:
    - name: Build debian package
      if: matrix.config.build_deb
      working-directory: ${{github.workspace}}/client/build
      run: cpack

    # Windows only:
    - name: Upload artifact
      if: startswith(matrix.config.os, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-client-windows
        path: ${{github.workspace}}/client/build/${{matrix.config.build_type}}

    # Linux only:
    - name: Upload debian package artifact
      if: matrix.config.build_deb
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-client-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/client/build/*.deb

  build-server:
    name: server ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "windows_x64_clang"
          os: windows-latest
          generator: "Visual Studio 17 2022"
          arch: "-A x64"
          toolset: "-T ClangCL"
          target: ALL_BUILD
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: true
          defines: "-DINSTALL_SYSTEMD_SERVICE=ON"
          ccov: false

        - name: "ubuntu_24.04 (debug+ccov)"
          os: ubuntu-24.04
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: traintastic-server-test
          jobs: 4
          build_type: Debug
          build_deb: false
          defines: "-DCODE_COVERAGE=ON"
          ccov: true

        - name: "ubuntu_24.04_arm64"
          os: ubuntu-24.04-arm
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: true
          defines: "-DINSTALL_SYSTEMD_SERVICE=ON"
          ccov: false

        - name: "macos-15-intel"
          os: "macos-15-intel"
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

        - name: "macos-15-arm64"
          os: "macos-15"
          generator: "Unix Makefiles"
          arch: ""
          toolset: ""
          target: all
          jobs: 4
          build_type: Release
          build_deb: false
          defines: ""
          ccov: false

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    # All:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Set VCPKG_ROOT
      if: startswith(matrix.config.os, 'windows') || startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('VCPKG_ROOT', process.env.VCPKG_INSTALLATION_ROOT || '');

    - name: Set CMAKE_OSX_ARCHITECTURES
      if: startswith(matrix.config.os, 'macos')
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('CMAKE_OSX_ARCHITECTURES', 'x86_64');

    # Ubuntu only:
    - name: apt update
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt update

    # Ubuntu only:
    - name: Install packages
      if: startswith(matrix.config.os, 'ubuntu')
      run: sudo apt install libboost-program-options-dev libboost-url-dev liblua5.4-dev lcov libarchive-dev clang-tidy libsystemd-dev

    # MacOS only:
    - name: Install brew packages
      if: startswith(matrix.config.os, 'macos')
      run: brew install libarchive lua@5.4

    # All:
    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/server/build

    # All:
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/server/build
      # Note the current convention is to use the -S and -B options here to specify source
      # and build directories, but this is only available with CMake 3.13 and higher.
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake $GITHUB_WORKSPACE/server -G "${{matrix.config.generator}}" ${{matrix.config.arch}} ${{matrix.config.toolset}} -DCMAKE_BUILD_TYPE=${{matrix.config.build_type}} ${{matrix.config.defines}}

    # All:
    - name: Build
      working-directory: ${{github.workspace}}/server/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config ${{matrix.config.build_type}} --target ${{matrix.config.target}} --parallel ${{matrix.config.jobs}}

    # mingw only
    #- name: Run tests (mingw)
    #  if: matrix.config.name == 'windows_x64_mingw'
    #  working-directory: ${{github.workspace}}/server/build
    #  run: |
    #    $env:PATH += ';C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin'
    #    ctest --output-on-failure

    # All:
    - name: Run tests
      if: matrix.config.name != 'windows_x64_mingw'
      working-directory: ${{github.workspace}}/server/build
      run: ctest --output-on-failure

    # Linux only:
    - name: Build debian package
      if: matrix.config.build_deb
      working-directory: ${{github.workspace}}/server/build
      run: cpack

    # Windows only:
    - name: Upload artifact
      if: matrix.config.name == 'windows_x64_clang'
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-windows
        path: ${{github.workspace}}/server/build/Release/traintastic-server.exe

    # Linux only:
    - name: Upload debian package artifact
      if: matrix.config.build_deb
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/server/build/*.deb

    # Code coverage:
    - name: Code coverage
      if: matrix.config.ccov
      working-directory: ${{github.workspace}}/server/build
      run: make ccov

    - name: "Code coverage: upload to coveralls.io"
      if: matrix.config.ccov
      continue-on-error: true
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        path-to-lcov: ${{github.workspace}}/server/build/ccov/traintastic-server-test.info

    - name: "Code coverage: upload artifact"
      if: matrix.config.ccov
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-server-test-code-coverage
        path: ${{github.workspace}}/server/build/ccov/*

  build-data:
    name: shared data ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    needs: [build-lang, build-manual]
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: "ubuntu_24.04"
          os: ubuntu-24.04
          defines: ""

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations

    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/shared/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/shared/build
      run: cmake $GITHUB_WORKSPACE/shared ${{matrix.config.defines}}

    - name: Build debian package
      working-directory: ${{github.workspace}}/shared/build
      run: cpack

    - name: Upload debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-data-deb-${{matrix.config.name}}
        path: ${{github.workspace}}/shared/build/*.deb

  build-lang:
    name: language files
    runs-on: ubuntu-latest

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Build language files
      working-directory: ${{github.workspace}}/shared/translations
      run: python3 json2lang.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations/*.lang

  build-manual:
    name: manual
    runs-on: ubuntu-latest

    steps:
    - uses: FranzDiebold/github-env-vars-action@v2

    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install python requirements
      working-directory: ${{github.workspace}}/manual
      run: sudo pip3 install -r requirements.txt

    - name: Build manual
      working-directory: ${{github.workspace}}/manual
      run: ./build.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output/*

  package-qtinstaller:
    name: package qtinstaller
    runs-on: windows-2022
    needs: [build-client, build-server, build-lang, build-manual]
    steps:
    - uses: FranzDiebold/github-env-vars-action@v2
    
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Download artifacts 1/2
      uses: actions/download-artifact@v4
      with:
        name: traintastic-client-windows
        path: ${{github.workspace}}/client/build/Release
    
    - name: Download artifacts 2/2
      uses: actions/download-artifact@v4
      with:
        name: traintastic-server-windows
        path: ${{github.workspace}}/server/build
    
    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations
    
    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output
    
    - name: Install Qt Installer Framework
      shell: pwsh
      run: |
        $qtifw_version = "4.8.1"
        $qtifw_url = "https://download.qt.io/official_releases/qt-installer-framework/$qtifw_version/QtInstallerFramework-windows-x64-$qtifw_version.exe"
        $qtifw_installer = "$env:TEMP\QtIFW-installer.exe"
        $install_path = "C:\Qt\Tools\QtInstallerFramework\$qtifw_version"
        
        Write-Host "Downloading Qt Installer Framework $qtifw_version..."
        Invoke-WebRequest -Uri $qtifw_url -OutFile $qtifw_installer
        
        Write-Host "Installing Qt Installer Framework..."
        Start-Process -FilePath $qtifw_installer -ArgumentList @(
          '--accept-licenses',
          '--confirm-command',
          '--root', $install_path,
          'install'
        ) -Wait -NoNewWindow
        
        Write-Host "Qt Installer Framework installed successfully"
    
    - name: Build installer
      shell: cmd
      run: |
        cd %GITHUB_WORKSPACE%\package\qtinstaller
        call build-installer.bat
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-qtinstaller
        path: ${{github.workspace}}/package/qtinstaller/output/*.exe
        
  package-qtinstaller-ubuntu:
    name: package qtinstaller ubuntu ${{matrix.config.arch}}
    runs-on: ${{matrix.config.os}}
    needs: [build-client, build-server, build-lang, build-manual]
    strategy:
      fail-fast: false
      matrix:
        config:
        - arch: x64
          os: ubuntu-24.04
          client_artifact: traintastic-client-deb-ubuntu_24.04
          server_artifact: traintastic-server-deb-ubuntu_24.04
        - arch: arm64
          os: ubuntu-24.04-arm
          client_artifact: traintastic-client-deb-ubuntu_24.04_arm64
          server_artifact: traintastic-server-deb-ubuntu_24.04_arm64
    
    steps:
    - uses: FranzDiebold/github-env-vars-action@v2
    
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install Qt Installer Framework
      run: |
        sudo apt update
        sudo apt install -y \ wget \ p7zip-full \ libxkbcommon-x11-0 \ libxkbcommon0 \ libxcb-xinerama0 \ libxcb-cursor0 \ libx11-xcb1 \ libxcb-keysyms1 \ libxcb-icccm4 \ libxcb-image0 \ libxcb-render-util0
        
        QTIFW_VERSION="4.8.1"
        if [ "${{ matrix.config.arch }}" = "arm64" ]; then
          QTIFW_URL="https://download.qt.io/official_releases/qt-installer-framework/${QTIFW_VERSION}/QtInstallerFramework-linux-arm64-${QTIFW_VERSION}.run"
        else
          QTIFW_URL="https://download.qt.io/official_releases/qt-installer-framework/${QTIFW_VERSION}/QtInstallerFramework-linux-x64-${QTIFW_VERSION}.run"
        fi

        echo "Downloading Qt Installer Framework ${QTIFW_VERSION}..."
        wget -q ${QTIFW_URL} -O /tmp/qtifw-installer.run
        
        echo "Installing Qt Installer Framework..."
        chmod +x /tmp/qtifw-installer.run
        /tmp/qtifw-installer.run --accept-licenses --confirm-command --root ~/QtIFW install
        
        echo "Qt Installer Framework installed successfully"
        echo "$HOME/QtIFW/bin" >> $GITHUB_PATH
    
    - name: Extract client files from deb
      run: |
        mkdir -p ${{github.workspace}}/client/extracted
        
        # Download the client deb artifact
        # Note: GitHub Actions will download to a subdirectory
    
    - name: Download client artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{matrix.config.client_artifact}}
        path: ${{github.workspace}}/client/deb
    
    - name: Download server artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{matrix.config.server_artifact}}
        path: ${{github.workspace}}/server/deb
    
    - name: "Download artifact: lang"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-lang
        path: ${{github.workspace}}/shared/translations
    
    - name: "Download artifact: manual"
      uses: actions/download-artifact@v4
      with:
        name: traintastic-manual
        path: ${{github.workspace}}/manual/output
    
    - name: Extract deb packages
      run: |
        # Extract client deb
        cd ${{github.workspace}}/client
        mkdir -p extracted
        dpkg-deb -x deb/*.deb extracted/
        
        # Extract server deb
        cd ${{github.workspace}}/server
        mkdir -p extracted
        dpkg-deb -x deb/*.deb extracted/
    
    - name: Prepare package structure
      run: |
        cd ${{github.workspace}}/package/qtinstaller-linux
        
        # Copy client files
        mkdir -p packages/org.traintastic.client/data
        cp -r ${{github.workspace}}/client/extracted/usr/* packages/org.traintastic.client/data/
        
        # Copy server files
        mkdir -p packages/org.traintastic.server/data
        cp -r ${{github.workspace}}/server/extracted/usr/* packages/org.traintastic.server/data/
        
        # Copy shared data
        mkdir -p packages/org.traintastic.shared/data/translations
        mkdir -p packages/org.traintastic.shared/data/manual
        mkdir -p packages/org.traintastic.shared/data/lncv
        
        cp ${{github.workspace}}/shared/translations/*.lang packages/org.traintastic.shared/data/translations/
        cp -r ${{github.workspace}}/manual/output/* packages/org.traintastic.shared/data/manual/
        cp ${{github.workspace}}/shared/data/lncv/xml/*.xml packages/org.traintastic.shared/data/lncv/
        cp ${{github.workspace}}/shared/data/lncv/xml/*.xsd packages/org.traintastic.shared/data/lncv/
        
        # Copy license
        cp ${{github.workspace}}/LICENSE packages/org.traintastic.server/meta/license.txt
        cp ${{github.workspace}}/LICENSE packages/org.traintastic.client/meta/license.txt
    
    - name: Build installer
      run: |
        cd ${{github.workspace}}/package/qtinstaller-linux
        chmod +x build-installer.sh
        ./build-installer.sh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-qtinstaller-ubuntu-${{matrix.config.arch}}
        path: ${{github.workspace}}/package/qtinstaller-linux/output/*.run
        
  update-readme-contributors:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    name: Update contributers in README.md
    steps:
        - name: Update contribute list
          uses: akhilmhdh/contributors-readme-action@v2.3.9
          env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
